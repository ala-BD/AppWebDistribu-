spring.application.name=apigateway
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.import-check.enabled=false
# Local fallback if Config Server is down
spring.cloud.config.fail-fast=false
server.port=9000
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Larger request/response bodies through the gateway (JSON payloads)
spring.codec.max-in-memory-size=10MB

# Match Eureka uppercase service ids (spring.application.name=catalogue -> CATALOGUE in registry)
spring.cloud.loadbalancer.eager-load.clients=CATALOGUE,COMMANDES

# Override if you still get 503 (Eureka empty / not ready): use direct URLs on same machine
apigateway.catalogue-uri=lb://CATALOGUE
apigateway.commandes-uri=lb://COMMANDES
# If 503: catalogue not in Eureka — use direct URLs on same PC (comment lb lines above first):
# apigateway.catalogue-uri=http://127.0.0.1:8095
# apigateway.commandes-uri=http://127.0.0.1:8098

# Faster registry refresh while developing
eureka.client.registry-fetch-interval-seconds=5
