spring.application.name=appdist-backend
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.import-check.enabled=false
# Local fallback if Config Server is down
spring.cloud.config.fail-fast=false

server.port=8081

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/eshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka config
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
