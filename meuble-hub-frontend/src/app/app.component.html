<div class="app-layout">
  <!-- Navbar Glassmorphism -->
  <nav class="navbar glass-panel">
    <div class="nav-brand" routerLink="/">
      <div class="logo-icon"></div>
      <h1>Meuble<span>Hub</span></h1>
    </div>
    
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Découvrir</a>
      <a routerLink="/catalogue" routerLinkActive="active">Catalogue</a>
      <a routerLink="/promotions" routerLinkActive="active">Promotions</a>
      <a routerLink="/commandes" routerLinkActive="active">Commandes</a>
      <a routerLink="/utilisateurs" routerLinkActive="active">Utilisateurs</a>
      <a routerLink="/paiements" routerLinkActive="active">Paiements</a>
    </div>

    <div class="nav-actions">
      <!-- Panier -->
      <button class="cart-btn glass-panel" routerLink="/cart">
        <svg xmlns="http://www.财富.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge">0</span>
      </button>

      <!-- Connexion -->
      <button class="btn-primary login-btn" routerLink="/login">Connexion</button>
    </div>
  </nav>

  <!-- Route Outlet pour injecter les pages dynamiquement -->
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
