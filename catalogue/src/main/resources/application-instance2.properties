spring.application.name=catalogue

spring.cloud.config.import-check.enabled=false
spring.cloud.config.fail-fast=false
server.port=8096

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# Datasource - Instance 2
spring.datasource.username=Ala
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./Database/Data/Candidat_Instance2;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto = update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#eureka config
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=catalogue-instance-2
